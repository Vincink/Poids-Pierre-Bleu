<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pierre Bleue — Accueil</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .home-title {
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      color: #ffffff;
      margin-top: 10px;
      margin-bottom: 8px;
    }
    .home-subtitle {
      font-size: 0.9rem;
      color: #9ca3af;
      text-align: center;
      margin-bottom: 28px;
    }
    .menu-btn {
      width: 100%;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 16px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }
    .menu-btn:active {
      transform: scale(0.98);
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
    }
    .menu-btn span.icon {
      font-size: 1.2rem;
      color: #10b981;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="home-title">Pierre Bleue</div>
    <div class="home-subtitle">Outils de calcul sur-mesure</div>

    <!-- Bouton redirigeant vers le fichier calcul-tranches.html -->
    <a href="calcul-tranches.html" class="menu-btn">
      <span>Calcul de poids des tranches</span>
      <span class="icon">➔</span>
    </a>

    <!-- Tu pourras ajouter d'autres boutons ici vers de futurs fichiers .html -->
  </div>

</body>
</html>
