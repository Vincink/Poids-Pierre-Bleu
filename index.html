<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pierre Bleue — Accueil</title>
  <style>
    :root {
      --primary-color: #10b981;
      --primary-rgb: 16, 185, 129;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }
    .header-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 10px;
    }
    .menu-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 10;
    }
    .menu-toggle span {
      display: block;
      width: 22px;
      height: 2px;
      background-color: #9ca3af;
      border-radius: 2px;
      transition: all 0.25s ease;
    }
    .home-title {
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .home-subtitle {
      font-size: 0.9rem;
      color: #9ca3af;
      text-align: center;
      margin-bottom: 28px;
    }
    .menu-btn {
      width: 100%;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 16px;
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }
    .menu-btn:active {
      transform: scale(0.98);
      background: rgba(var(--primary-rgb), 0.12);
      border-color: var(--primary-color);
    }
    .btn-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .btn-icon {
      width: 26px;
      height: 26px;
      stroke: var(--primary-color);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
      transition: stroke 0.3s;
    }
    .arrow-icon {
      font-size: 1.1rem;
      color: var(--primary-color);
      transition: color 0.3s;
    }
    .drawer {
      position: absolute;
      top: 0;
      right: -100%;
      width: 100%;
      height: 100%;
      background: #111827;
      border-radius: 20px;
      padding: 24px;
      box-sizing: border-box;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
      display: flex;
      flex-direction: column;
    }
    .drawer.open {
      right: 0;
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .drawer-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
    }
    .btn-close {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #9ca3af;
      font-size: 1.2rem;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theme-section-title {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 12px;
      font-weight: 500;
    }
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .theme-option {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: #f3f4f6;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .theme-option:active {
      transform: scale(0.96);
    }
    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-bar">
      <button class="menu-toggle" onclick="toggleDrawer(true)" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <div class="home-title">Pierre Bleue</div>
    <div class="home-subtitle">Outils de calcul sur-mesure</div>

    <!-- Bouton 1 : Tranches -->
    <a href="calcul-tranches.html" class="menu-btn">
      <div class="btn-left">
        <svg class="btn-icon" viewBox="0 0 24 24">
          <path d="M2 9l10-5 10 5-10 5-10-5z"/>
          <path d="M2 9v4l10 5 10-5V9"/>
          <path d="M12 14v4"/>
        </svg>
        <span>Calcul de poids des tranches</span>
      </div>
      <span class="arrow-icon">➔</span>
    </a>

    <!-- Bouton 2 : M³ en Tonnes -->
    <a href="m3-en-tonnes.html" class="menu-btn">
      <div class="btn-left">
        <svg class="btn-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="6" r="2.5" />
          <path d="M8.5 9.5 h7 a1.5 1.5 0 0 1 1.4 1.0 l2.5 8.5 a1.5 1.5 0 0 1 -1.4 1.9 h-12 a1.5 1.5 0 0 1 -1.4 -1.9 l2.5 -8.5 a1.5 1.5 0 0 1 1.4 -1.0 z" />
        </svg>
        <span>M3 en Tonnes</span>
      </div>
      <span class="arrow-icon">➔</span>
    </a>

    <!-- Bouton 3 : M³ Cumulés -->
    <a href="m3-multiple.html" class="menu-btn">
      <div class="btn-left">
        <svg class="btn-icon" viewBox="0 0 24 24">
          <path d="M4 6h16"/>
          <path d="M4 12h16"/>
          <path d="M4 18h10"/>
          <circle cx="18" cy="18" r="2"/>
        </svg>
        <span>M3 Cumulés (Multi-lignes)</span>
      </div>
      <span class="arrow-icon">➔</span>
    </a>

    <!-- Bouton 4 : M² Cumulés -->
    <a href="m2-multiple.html" class="menu-btn">
      <div class="btn-left">
        <svg class="btn-icon" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18"/>
          <path d="M9 21V9"/>
        </svg>
        <span>M² Cumulés (Multi-lignes)</span>
      </div>
      <span class="arrow-icon">➔</span>
    </a>

    <!-- Panneau de Réglages Thèmes -->
    <div id="drawer" class="drawer">
      <div class="drawer-header">
        <div class="drawer-title">Paramètres</div>
        <button class="btn-close" onclick="toggleDrawer(false)">✕</button>
      </div>

      <div class="theme-section-title">Couleur du thème</div>
      <div class="theme-grid">
        <div class="theme-option" onclick="setTheme('#10b981', '16, 185, 129')">
          <div class="color-dot" style="background: #10b981;"></div>
          <span>Vert Néon</span>
        </div>
        <div class="theme-option" onclick="setTheme('#3b82f6', '59, 130, 246')">
          <div class="color-dot" style="background: #3b82f6;"></div>
          <span>Bleu Néon</span>
        </div>
        <div class="theme-option" onclick="setTheme('#a855f7', '168, 85, 247')">
          <div class="color-dot" style="background: #a855f7;"></div>
          <span>Violet Néon</span>
        </div>
        <div class="theme-option" onclick="setTheme('#f97316', '249, 115, 22')">
          <div class="color-dot" style="background: #f97316;"></div>
          <span>Orange Néon</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleDrawer(open) {
      document.getElementById('drawer').classList.toggle('open', open);
    }

    function setTheme(color, rgb) {
      document.documentElement.style.setProperty('--primary-color', color);
      document.documentElement.style.setProperty('--primary-rgb', rgb);
      localStorage.setItem('themeColor', color);
      localStorage.setItem('themeRgb', rgb);
      toggleDrawer(false);
    }

    const savedColor = localStorage.getItem('themeColor');
    const savedRgb = localStorage.getItem('themeRgb');
    if (savedColor && savedRgb) {
      document.documentElement.style.setProperty('--primary-color', savedColor);
      document.documentElement.style.setProperty('--primary-rgb', savedRgb);
    }
  </script>
</body>
</html>
