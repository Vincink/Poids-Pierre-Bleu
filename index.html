<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur Pierre Bleue</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 20px;
      color: #ffffff;
      font-weight: 700;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input[type="number"] {
      width: 100%;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 12px 16px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="number"]:focus {
      border-color: #10b981;
    }
    .thickness-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .thickness-btn {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 10px 0;
      color: #9ca3af;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      user-select: none;
      transition: all 0.15s ease;
    }
    .thickness-btn:active {
      transform: scale(0.96);
    }
    .thickness-btn.active {
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      color: #10b981;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
    }

    .counter-wrapper {
      display: flex;
      align-items: center;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      overflow: hidden;
    }
    .btn-qty {
      background: #374151;
      color: #ffffff;
      border: none;
      width: 48px;
      height: 48px;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background 0.2s;
    }
    .btn-qty:active {
      background: #10b981;
    }
    .counter-input {
      border: none !important;
      border-radius: 0 !important;
      text-align: center;
      background: transparent !important;
      font-size: 1.1rem !important;
      font-weight: 600;
    }

    .results {
      background: rgba(16, 185, 129, 0.05);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-top: 20px;
    }
    .secondary-result {
      font-size: 0.95rem;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    .main-result {
      font-size: 2.5rem;
      font-weight: 800;
      color: #10b981;
      margin: 6px 0;
      letter-spacing: -0.5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Calcul tranches — Pierre Bleue</h1>

    <div class="field">
      <label>Longueur (cm)</label>
      <input type="number" id="length" inputmode="decimal" placeholder="Ex : 250" oninput="calculate()">
    </div>

    <div class="field">
      <label>Largeur (cm)</label>
      <input type="number" id="width" inputmode="decimal" placeholder="Ex : 120" oninput="calculate()">
    </div>

    <div class="field">
      <label>Épaisseur (cm)</label>
      <div class="thickness-grid">
        <button class="thickness-btn" onclick="selectThickness(1.5, this)">1.5</button>
        <button class="thickness-btn active" onclick="selectThickness(2, this)">2</button>
        <button class="thickness-btn" onclick="selectThickness(3, this)">3</button>
        <button class="thickness-btn" onclick="selectThickness(4, this)">4</button>
        <button class="thickness-btn" onclick="selectThickness(5, this)">5</button>
        <button class="thickness-btn" onclick="selectThickness(6, this)">6</button>
        <button class="thickness-btn" onclick="selectThickness(7, this)">7</button>
        <button class="thickness-btn" onclick="selectThickness(8, this)">8</button>
        <button class="thickness-btn" onclick="selectThickness(9, this)">9</button>
        <button class="thickness-btn" onclick="selectThickness(10, this)">10</button>
        <button class="thickness-btn" onclick="selectThickness(12, this)">12</button>
        <button class="thickness-btn" onclick="selectThickness(15, this)">15</button>
        <button class="thickness-btn" onclick="selectThickness(20, this)">20</button>
      </div>
    </div>

    <div class="field">
      <label>Nombre de tranches</label>
      <div class="counter-wrapper">
        <button class="btn-qty" onclick="changeCount(-1)">−</button>
        <input type="number" id="count" class="counter-input" inputmode="numeric" value="1" min="1" oninput="calculate()">
        <button class="btn-qty" onclick="changeCount(1)">+</button>
      </div>
    </div>

    <div class="results">
      <div class="secondary-result" id="area">0.00 m²</div>
      <div class="secondary-result" id="volume">0.000 m³</div>
      <div class="main-result" id="weightT">0.000 T</div>
      <div class="secondary-result" id="weightKg">0 kg</div>
    </div>
  </div>

  <script>
    let selectedThickness = 2;

    function selectThickness(val, btn) {
      selectedThickness = val;
      document.querySelectorAll('.thickness-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calculate();
    }

    function changeCount(delta) {
      const input = document.getElementById('count');
      let val = (parseInt(input.value) || 1) + delta;
      if (val < 1) val = 1;
      input.value = val;
      calculate();
    }

    function calculate() {
      const l = parseFloat(document.getElementById('length').value) || 0;
      const w = parseFloat(document.getElementById('width').value) || 0;
      const count = parseFloat(document.getElementById('count').value) || 1;
      const density = 2.68;

      const areaSqM = (l * w / 10000) * count;
      const volCuM = (l * w * selectedThickness / 1000000) * count;
      const weightTons = volCuM * density;
      const weightKg = weightTons * 1000;

      document.getElementById('area').innerText = areaSqM.toFixed(2) + ' m²';
      document.getElementById('volume').innerText = volCuM.toFixed(3) + ' m³';
      document.getElementById('weightT').innerText = weightTons.toFixed(3) + ' T';
      document.getElementById('weightKg').innerText = Math.round(weightKg).toLocaleString('fr-FR') + ' kg';
    }

    calculate();
  </script>
</body>
</html>
