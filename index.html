<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Forcer le nom "MCube" sur l'écran d'accueil iOS/iPadOS -->
  <title>MCube</title>
  <meta name="apple-mobile-web-app-title" content="MCube">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Icône de l'application -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    :root {
      --primary-color: #10b981;
      --primary-rgb: 16, 185, 129;
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text-main: #ffffff;
      --text-sub: #9ca3af;
      --btn-bg: #1f2937;
      --btn-border: #374151;
    }
    [data-theme="light"] {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --card-border: #e5e7eb;
      --text-main: #111827;
      --text-sub: #4b5563;
      --btn-bg: #f9fafb;
      --btn-border: #d1d5db;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: background-color 0.3s;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      transition: background 0.3s, border-color 0.3s;
    }
    .header-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 10px;
    }
    .menu-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 10;
    }
    .menu-toggle span {
      display: block;
      width: 22px;
      height: 2px;
      background-color: var(--text-sub);
      border-radius: 2px;
    }
    .home-title {
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      color: var(--text-main);
      margin-bottom: 8px;
    }
    .home-subtitle {
      font-size: 0.9rem;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 28px;
    }
    .menu-btn {
      width: 100%;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 14px;
      padding: 16px;
      color: var(--text-main);
      font-size: 0.98rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }
    .menu-btn:active {
      transform: scale(0.98);
      background: rgba(var(--primary-rgb), 0.12);
      border-color: var(--primary-color);
    }
    .btn-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .btn-icon {
      width: 26px;
      height: 26px;
      stroke: var(--primary-color);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }
    .arrow-icon {
      font-size: 1.1rem;
      color: var(--primary-color);
    }
    .drawer {
      position: absolute;
      top: 0;
      right: -100%;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      box-sizing: border-box;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
      display: flex;
      flex-direction: column;
    }
    .drawer.open {
      right: 0;
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .drawer-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .btn-close {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      color: var(--text-sub);
      font-size: 1.2rem;
      width: 32px;
      height: 32px;
      cursor: pointer;
    }
    .setting-group {
      margin-bottom: 20px;
    }
    .theme-section-title {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 10px;
      font-weight: 500;
    }
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .theme-option {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 500;
    }
    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
    }
    .mode-toggle-btn {
      width: 100%;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 12px;
      padding: 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-bar">
      <button class="menu-toggle" onclick="toggleDrawer(true)" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <div class="home-title">Pierre Bleue</div>
    <div class="home-subtitle">Outils de calcul sur-mesure</div>

    <a href="calcul-tranches.html" class="menu-btn">
      <div class="btn-left">
        <svg class="btn-icon" viewBox="0 0 24 24">
          <path d="M2 9l10-5 10 5-10 5-10-5z"/>
          <path d="M2 9v4l10 5 10-5V9"/>
          <path d="M12 14v4"/>
        </svg>
        <span>Calcul de poids des tranches</span>
      </div>
      <span class="arrow-icon">➔</span>
    </a>

    <a href="m3-en-tonnes.html" class="menu-btn">
      <div class="btn-left">
        <svg class="btn-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="6" r="2.5" />
          <path d="M8.5 9.5 h7 a1.5 1.5 0 0 1 1.4 1.0 l2.5 8.5 a1.5 1.5 0 0 1 -1.4 1.9 h-12 a1.5 1.5 0 0 1 -1.4 -1.9 l2.5 -8.5 a1.5 1.5 0 0 1 1.4 -1.0 z" />
        </svg>
        <span>M3 en Tonnes</span>
      </div>
      <span class="arrow-icon">➔</span>
    </a>

    <a href="m3-multiple.html" class="menu-btn">
      <div class="btn-left">
        <svg class="btn-icon" viewBox="0 0 24 24">
          <path d="M4 6h16"/>
          <path d="M4 12h16"/>
          <path d="M4 18h10"/>
          <circle cx="18" cy="18" r="2"/>
        </svg>
        <span>M3 Cumulés (Multi-lignes)</span>
      </div>
      <span class="arrow-icon">➔</span>
    </a>

    <a href="m2-multiple.html" class="menu-btn">
      <div class="btn-left">
        <svg class="btn-icon" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18"/>
          <path d="M9 21V9"/>
        </svg>
        <span>M² Cumulés (Multi-lignes)</span>
      </div>
      <span class="arrow-icon">➔</span>
    </a>

    <!-- Menu Hamburger -->
    <div id="drawer" class="drawer">
      <div class="drawer-header">
        <div class="drawer-title">Paramètres</div>
        <button class="btn-close" onclick="toggleDrawer(false)">✕</button>
      </div>

      <div class="setting-group">
        <div class="theme-section-title">Mode d'affichage</div>
        <button class="mode-toggle-btn" onclick="toggleDisplayMode()">
          <span id="mode-icon">☀️</span> <span id="mode-text">Passer au Mode Clair</span>
        </button>
      </div>

      <div class="setting-group">
        <div class="theme-section-title">Couleur du thème</div>
        <div class="theme-grid">
          <div class="theme-option" onclick="setTheme('#10b981', '16, 185, 129')">
            <div class="color-dot" style="background: #10b981;"></div>
            <span>Vert Néon</span>
          </div>
          <div class="theme-option" onclick="setTheme('#3b82f6', '59, 130, 246')">
            <div class="color-dot" style="background: #3b82f6;"></div>
            <span>Bleu Néon</span>
          </div>
          <div class="theme-option" onclick="setTheme('#a855f7', '168, 85, 247')">
            <div class="color-dot" style="background: #a855f7;"></div>
            <span>Violet Néon</span>
          </div>
          <div class="theme-option" onclick="setTheme('#f97316', '249, 115, 22')">
            <div class="color-dot" style="background: #f97316;"></div>
            <span>Orange Néon</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleDrawer(open) {
      document.getElementById('drawer').classList.toggle('open', open);
    }

    function setTheme(color, rgb) {
      document.documentElement.style.setProperty('--primary-color', color);
      document.documentElement.style.setProperty('--primary-rgb', rgb);
      localStorage.setItem('themeColor', color);
      localStorage.setItem('themeRgb', rgb);
      toggleDrawer(false);
    }

    function toggleDisplayMode() {
      const currentMode = document.documentElement.getAttribute('data-theme') || 'dark';
      const newMode = currentMode === 'dark' ? 'light' : 'dark';
      applyDisplayMode(newMode);
      localStorage.setItem('displayMode', newMode);
    }

    function applyDisplayMode(mode) {
      document.documentElement.setAttribute('data-theme', mode);
      document.getElementById('mode-icon').innerText = mode === 'light' ? '🌙' : '☀️';
      document.getElementById('mode-text').innerText = mode === 'light' ? 'Passer au Mode Sombre' : 'Passer au Mode Clair';
    }

    const savedColor = localStorage.getItem('themeColor');
    const savedRgb = localStorage.getItem('themeRgb');
    if (savedColor && savedRgb) {
      document.documentElement.style.setProperty('--primary-color', savedColor);
      document.documentElement.style.setProperty('--primary-rgb', savedRgb);
    }
    const savedMode = localStorage.getItem('displayMode') || 'dark';
    applyDisplayMode(savedMode);
  </script>
</body>
</html>
