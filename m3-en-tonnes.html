<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>M³ en Tonnes — Pierre Bleue</title>
  <style>
    :root {
      --primary-color: #10b981;
      --primary-rgb: 16, 185, 129;
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text-main: #ffffff;
      --text-sub: #9ca3af;
      --btn-bg: #1f2937;
      --btn-border: #374151;
    }
    [data-theme="light"] {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --card-border: #e5e7eb;
      --text-main: #111827;
      --text-sub: #4b5563;
      --btn-bg: #f9fafb;
      --btn-border: #d1d5db;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: background-color 0.3s;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .header-calc {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .btn-back {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--primary-color);
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
    }
    h1 {
      font-size: 1.2rem;
      color: var(--text-main);
      font-weight: 700;
      text-align: center;
      flex-grow: 1;
    }
    .field { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      font-weight: 500;
    }
    input[type="number"] {
      width: 100%;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 1.1rem;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: var(--primary-color);
    }
    .results {
      background: rgba(var(--primary-rgb), 0.05);
      border: 1px solid rgba(var(--primary-rgb), 0.2);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      margin-top: 24px;
    }
    .secondary-result {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .main-result {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--primary-color);
      margin: 8px 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-calc">
      <a href="index.html" class="btn-back">← Accueil</a>
      <h1>M³ en Tonnes</h1>
      <div style="width: 70px;"></div>
    </div>

    <div class="field">
      <label>Volume (m³)</label>
      <input type="number" id="volume" inputmode="decimal" placeholder="Ex : 1.5" oninput="calculate()">
    </div>

    <div class="results">
      <div class="secondary-result" id="densityInfo">Densité : 2.68 t/m³</div>
      <div class="main-result" id="weightT">0.000 T</div>
      <div class="secondary-result" id="weightKg">0 kg</div>
    </div>
  </div>

  <script>
    const savedColor = localStorage.getItem('themeColor');
    const savedRgb = localStorage.getItem('themeRgb');
    if (savedColor && savedRgb) {
      document.documentElement.style.setProperty('--primary-color', savedColor);
      document.documentElement.style.setProperty('--primary-rgb', savedRgb);
    }
    const savedMode = localStorage.getItem('displayMode') || 'dark';
    document.documentElement.setAttribute('data-theme', savedMode);

    function calculate() {
      const vol = parseFloat(document.getElementById('volume').value) || 0;
      const density = 2.68;
      const weightTons = vol * density;
      const weightKg = weightTons * 1000;

      document.getElementById('weightT').innerText = weightTons.toFixed(3) + ' T';
      document.getElementById('weightKg').innerText = Math.round(weightKg).toLocaleString('fr-FR') + ' kg';
    }

    calculate();
  </script>
</body>
</html>
