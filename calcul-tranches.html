<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calcul tranches — Pierre Bleue</title>
  <style>
    :root {
      --primary-color: #10b981;
      --primary-rgb: 16, 185, 129;
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text-main: #ffffff;
      --text-sub: #9ca3af;
      --btn-bg: #1f2937;
      --btn-border: #374151;
    }
    [data-theme="light"] {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --card-border: #e5e7eb;
      --text-main: #111827;
      --text-sub: #4b5563;
      --btn-bg: #f9fafb;
      --btn-border: #d1d5db;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: background-color 0.3s;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .header-calc {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .btn-back {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--primary-color);
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
    }
    h1 {
      font-size: 1.2rem;
      color: var(--text-main);
      font-weight: 700;
      text-align: center;
      flex-grow: 1;
    }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      font-weight: 500;
    }
    input[type="number"] {
      width: 100%;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: var(--primary-color);
    }
    .thickness-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .thickness-btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 10px;
      padding: 10px 0;
      color: var(--text-sub);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .thickness-btn.active {
      background: rgba(var(--primary-rgb), 0.15);
      border-color: var(--primary-color);
      color: var(--primary-color);
    }
    .counter-wrapper {
      display: flex;
      align-items: center;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 12px;
      overflow: hidden;
    }
    .btn-qty {
      background: var(--btn-border);
      color: var(--text-main);
      border: none;
      width: 48px;
      height: 48px;
      font-size: 1.4rem;
      font-weight: bold;
    }
    .counter-input {
      border: none !important;
      text-align: center;
      background: transparent !important;
      font-size: 1.1rem !important;
      font-weight: 600;
    }
    .results {
      background: rgba(var(--primary-rgb), 0.05);
      border: 1px solid rgba(var(--primary-rgb), 0.2);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-top: 20px;
    }
    .secondary-result {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .main-result {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary-color);
      margin: 6px 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-calc">
      <a href="index.html" class="btn-back">← Accueil</a>
      <h1>Calcul tranches</h1>
      <div style="width: 70px;"></div>
    </div>

    <div class="field">
      <label>Longueur (cm)</label>
      <input type="number" id="length" inputmode="decimal" placeholder="Ex : 250" oninput="calculate()">
    </div>

    <div class="field">
      <label>Largeur (cm)</label>
      <input type="number" id="width" inputmode="decimal" placeholder="Ex : 120" oninput="calculate()">
    </div>

    <div class="field">
      <label>Épaisseur (cm)</label>
      <div class="thickness-grid">
        <button class="thickness-btn" onclick="selectThickness(1.5, this)">1.5</button>
        <button class="thickness-btn active" onclick="selectThickness(2, this)">2</button>
        <button class="thickness-btn" onclick="selectThickness(3, this)">3</button>
        <button class="thickness-btn" onclick="selectThickness(4, this)">4</button>
        <button class="thickness-btn" onclick="selectThickness(5, this)">5</button>
        <button class="thickness-btn" onclick="selectThickness(6, this)">6</button>
        <button class="thickness-btn" onclick="selectThickness(7, this)">7</button>
        <button class="thickness-btn" onclick="selectThickness(8, this)">8</button>
        <button class="thickness-btn" onclick="selectThickness(9, this)">9</button>
        <button class="thickness-btn" onclick="selectThickness(10, this)">10</button>
        <button class="thickness-btn" onclick="selectThickness(12, this)">12</button>
        <button class="thickness-btn" onclick="selectThickness(15, this)">15</button>
        <button class="thickness-btn" onclick="selectThickness(20, this)">20</button>
      </div>
    </div>

    <div class="field">
      <label>Nombre de tranches</label>
      <div class="counter-wrapper">
        <button class="btn-qty" onclick="changeCount(-1)">−</button>
        <input type="number" id="count" class="counter-input" inputmode="numeric" value="1" min="1" oninput="calculate()">
        <button class="btn-qty" onclick="changeCount(1)">+</button>
      </div>
    </div>

    <div class="results">
      <div class="secondary-result" id="area">0.00 m²</div>
      <div class="secondary-result" id="volume">0.000 m³</div>
      <div class="main-result" id="weightT">0.000 T</div>
      <div class="secondary-result" id="weightKg">0 kg</div>
    </div>
  </div>

  <script>
    let selectedThickness = 2;

    const savedColor = localStorage.getItem('themeColor');
    const savedRgb = localStorage.getItem('themeRgb');
    if (savedColor && savedRgb) {
      document.documentElement.style.setProperty('--primary-color', savedColor);
      document.documentElement.style.setProperty('--primary-rgb', savedRgb);
    }
    const savedMode = localStorage.getItem('displayMode') || 'dark';
    document.documentElement.setAttribute('data-theme', savedMode);

    function selectThickness(val, btn) {
      selectedThickness = val;
      document.querySelectorAll('.thickness-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calculate();
    }

    function changeCount(delta) {
      const input = document.getElementById('count');
      let val = (parseInt(input.value) || 1) + delta;
      if (val < 1) val = 1;
      input.value = val;
      calculate();
    }

    function calculate() {
      const l = parseFloat(document.getElementById('length').value) || 0;
      const w = parseFloat(document.getElementById('width').value) || 0;
      const count = parseFloat(document.getElementById('count').value) || 1;
      const density = 2.68;

      const areaSqM = (l * w / 10000) * count;
      const volCuM = (l * w * selectedThickness / 1000000) * count;
      const weightTons = volCuM * density;
      const weightKg = weightTons * 1000;

      document.getElementById('area').innerText = areaSqM.toFixed(2) + ' m²';
      document.getElementById('volume').innerText = volCuM.toFixed(3) + ' m³';
      document.getElementById('weightT').innerText = weightTons.toFixed(3) + ' T';
      document.getElementById('weightKg').innerText = Math.round(weightKg).toLocaleString('fr-FR') + ' kg';
    }

    calculate();
  </script>
</body>
</html>
